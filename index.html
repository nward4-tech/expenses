<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expenses">
<meta name="theme-color" content="#0a0a0f">
<meta name="robots" content="noindex">
<title>Expenses</title>
<style>
:root{--bg:#0a0a0f;--ln:#24242e;--tx:#e6e6ec;--dim:#6b6b80;--cy:#00e5ff;--yl:#d4a52a;--ok:#3dff8a;--er:#ff4d6d}
*{box-sizing:border-box;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;gap:12px;height:100dvh;overflow:hidden;background:var(--bg);color:var(--tx);
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.top{flex:none;display:flex;justify-content:space-between;font-size:11px;letter-spacing:3px;color:var(--dim)}
.top span:first-child{color:var(--cy)}
#msg{flex:none;text-align:center;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);min-height:16px}
#msg.ok{color:var(--ok)}#msg.err{color:var(--er)}
.cut{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
#amt,#desc{flex:none;width:100%;background:#111118;border:1px solid var(--ln);border-radius:0;color:var(--tx);-webkit-appearance:none}
#amt{font-size:36px;font-weight:700;text-align:center;height:76px;padding:8px}
#desc{font-size:18px;height:58px;padding:10px 16px}
#amt::placeholder,#desc::placeholder{color:#3d3d4d}
input:focus{outline:none;border-color:var(--cy)}
.cats{flex:1 1 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px;min-height:0}
.cats button{min-width:0;min-height:0;overflow:hidden;font-size:clamp(10px,3vw,13px);font-weight:600;letter-spacing:0;text-transform:uppercase;line-height:1.25;padding:2px 3px;overflow-wrap:break-word;
  color:#a8a8ba;background:#111118;border:1px solid var(--ln);border-radius:0;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.cats button.on{color:var(--cy);border-color:var(--cy);background:rgba(0,229,255,.07)}
#save{flex:none;width:100%;height:64px;font-size:18px;font-weight:800;letter-spacing:6px;text-transform:uppercase;border:0;border-radius:0;background:var(--yl);color:#0a0a0f}
#save{position:relative;overflow:hidden;transition:background .25s,color .25s}
#save:disabled{opacity:.85}
#save.busy::after{content:"";position:absolute;top:0;bottom:0;left:0;width:60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:sweep .9s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(220%)}}
#save.done{background:var(--ok);animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(.95)}70%{transform:scale(1.02)}100%{transform:scale(1)}}
#save.fail{background:var(--er);color:#fff;animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.view{flex:1 1 0;display:flex;flex-direction:column;gap:12px;min-height:0}
.hidden{display:none!important}
.top{align-items:center}
#title{cursor:pointer}
#histBtn{font:inherit;font-size:11px;letter-spacing:2px;color:var(--cy);background:none;border:1px solid var(--ln);border-radius:0;padding:7px 10px}
.nav{flex:none;display:flex;align-items:center;gap:8px}
.nav button{font:inherit;color:var(--tx);background:#111118;border:1px solid var(--ln);border-radius:0;height:42px}
#prev,#next{width:46px;font-size:20px}
#per{flex:1;text-align:center;font-size:15px;letter-spacing:2px}
#allBtn{padding:0 12px;font-size:11px;letter-spacing:2px}
#allBtn.on{background:var(--yl);color:var(--bg);border-color:var(--yl)}
.tot{flex:none;text-align:center}
.tot b{display:block;font-size:40px;color:var(--yl);line-height:1.1}
.tot small{font-size:11px;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
.chips{flex:none;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font:inherit;font-size:11px;text-transform:uppercase;white-space:nowrap;padding:9px 10px;color:#a8a8ba;background:#111118;border:1px solid var(--ln);border-radius:0}
.chips button.on{color:var(--cy);border-color:var(--cy);background:rgba(0,229,255,.07)}
.chips button i{font-style:normal;color:var(--dim);margin-left:6px}
.list{flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--ln)}
.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid #17171f}
.row .d{flex:none;width:50px;font-size:11px;color:var(--dim);line-height:1.3}
.row .w{flex:1;min-width:0}
.row .w div{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .w small{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.row .a{flex:none;font-size:15px;font-weight:700}
.empty{text-align:center;color:var(--dim);font-size:12px;padding:32px 0;letter-spacing:1px}
.dpick{position:relative;font-size:11px;letter-spacing:2px;color:var(--dim);border:1px solid var(--ln);padding:7px 10px}
.dpick.past{color:var(--bg);background:var(--yl);border-color:var(--yl)}
.dpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0}
#q{flex:none;width:100%;font:inherit;font-size:16px;padding:10px 12px;color:var(--tx);background:#111118;border:1px solid var(--ln);border-radius:0;-webkit-appearance:none}
#q::placeholder{color:#3d3d4d}
</style>
</head>
<body>
<div class="top"><span id="title">EXPENSES_</span><label class="dpick" id="dpick"><span id="dlabel">TODAY</span><input type="date" id="dt"></label><button id="histBtn">HISTORY</button></div>
<div class="view" id="logV">
<div id="msg">ready</div>
<input id="amt" class="cut" inputmode="decimal" placeholder="฿ 0" autocomplete="off">
<input id="desc" class="cut" placeholder="What is it?" autocomplete="off">
<div class="cats" id="cats"></div>
<button id="save" class="cut">Save</button>
</div>
<div class="view hidden" id="histV">
<div class="nav"><button id="prev">‹</button><div id="per"></div><button id="next">›</button><button id="allBtn">ALL</button></div>
<input id="q" type="search" placeholder="search…" autocomplete="off">
<div class="tot" id="tot"></div>
<div class="chips" id="chips"></div>
<div class="list" id="list"></div>
</div>
<script>
var API = 'https://script.google.com/macros/s/AKfycbxNzH26j_WTSHnCahMTZK1XTc2l-VLRYuuUcSBcLdRGdQooqvyqbCOlUJijT8MCWAy31g/exec';
var DEFAULT_CATS = ['Food & Dining','Groceries','Petrol','Car','House expense','Bills & Utilities','Kids','Family','Health','Insurance','Personal','Wardrobe','Electronics','Entertainment','Subscriptions','Travel','Gifts & Donations','Other'];

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

// The secret key lives only in the link's #fragment (never sent to GitHub) and in this phone's storage.
var m = location.hash.match(/k=([^&]+)/);
var KEY = m ? decodeURIComponent(m[1]) : store('exp_key');
if (m) store('exp_key', KEY);

var box = document.getElementById('cats'), msg = document.getElementById('msg'), save = document.getElementById('save');
var amt = document.getElementById('amt'), desc = document.getElementById('desc'), cat = '';

function say(t, cls) { msg.textContent = t; msg.className = cls || ''; }
function fmt(n) { return '฿' + Number(n || 0).toLocaleString(); }
function mark() { [].forEach.call(box.children, function (x) { x.classList.toggle('on', x.textContent === cat); }); }
function drawCats(list) {
  box.innerHTML = '';
  list.forEach(function (c) {
    var b = document.createElement('button'); b.textContent = c;
    b.onclick = function () { cat = cat === c ? '' : c; mark(); };
    box.appendChild(b);
  });
}
function showTotals(t) { if (t) say('today ' + fmt(t.today) + ' // month ' + fmt(t.month)); }

var cached = null; try { cached = JSON.parse(store('exp_cats') || 'null'); } catch (e) {}
drawCats(cached || DEFAULT_CATS);

if (!KEY) {
  say('Missing key — open the full link once', 'err'); save.disabled = true;
} else {
  fetch(API + '?action=cats&key=' + encodeURIComponent(KEY))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.cats && d.cats.length) { drawCats(d.cats); store('exp_cats', JSON.stringify(d.cats)); }
      showTotals(d.totals);
    })
    .catch(function () { /* offline or slow: keep cached categories */ });
}

// ---------- Date ----------
var MONS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
var dt = document.getElementById('dt'), dlabel = document.getElementById('dlabel'), dpick = document.getElementById('dpick');
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function setDate(s) {
  dt.value = s || todayStr();
  var isToday = dt.value === todayStr(), p = dt.value.split('-');
  dlabel.textContent = isToday ? 'TODAY' : p[2] + ' ' + MONS[+p[1] - 1];
  dpick.classList.toggle('past', !isToday);
}
dt.onchange = function () { setDate(dt.value); };
setDate();

function resetBtn() { save.className = 'cut'; save.disabled = false; save.textContent = 'Save'; }

save.onclick = function () {
  var a = amt.value.replace(/,/g, '').trim(), d = desc.value.trim();
  if (!(parseFloat(a) > 0)) { say('Enter an amount', 'err'); amt.focus(); return; }
  if (!d) { say('What was it?', 'err'); desc.focus(); return; }
  if (document.activeElement) document.activeElement.blur();
  save.disabled = true; save.classList.add('busy'); save.textContent = 'Sending';
  fetch(API, { method: 'POST', body: JSON.stringify({ key: KEY, amount: a, desc: d, cat: cat, date: dt.value || todayStr() }) })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.ok) throw new Error(res.error || 'Not saved');
      say('✓ logged ' + fmt(a) + (dt.value !== todayStr() ? ' on ' + dlabel.textContent : '') + ' // today ' + fmt(res.totals.today) + ' // month ' + fmt(res.totals.month), 'ok');
      amt.value = ''; desc.value = ''; cat = ''; mark(); stale = true; setDate();
      save.classList.remove('busy'); save.classList.add('done'); save.textContent = '✓ Saved';
      setTimeout(resetBtn, 1400);
    })
    .catch(function (e) {
      say('⚠ ' + (e.message || 'Not saved — check signal and try again'), 'err');
      save.classList.remove('busy'); save.classList.add('fail'); save.textContent = 'Retry';
      setTimeout(resetBtn, 1600);
    });
};

// ---------- History ----------
var MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
var rows = null, stale = true, mode = 'month', fcat = '', q = document.getElementById('q');
q.oninput = function () { render(); };
var logV = document.getElementById('logV'), histV = document.getElementById('histV'), histBtn = document.getElementById('histBtn');
var per = document.getElementById('per'), tot = document.getElementById('tot'), chips = document.getElementById('chips'), list = document.getElementById('list');
var prevB = document.getElementById('prev'), nextB = document.getElementById('next'), allB = document.getElementById('allBtn');
function ymOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
var ym = ymOf(new Date());
function shift(n) { var p = ym.split('-').map(Number); ym = ymOf(new Date(p[0], p[1] - 1 + n, 1)); fcat = ''; render(); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

document.getElementById('title').onclick = function () { location.reload(); };
histBtn.onclick = function () { showHist(histV.classList.contains('hidden')); };
prevB.onclick = function () { shift(-1); };
nextB.onclick = function () { shift(1); };
allB.onclick = function () { mode = mode === 'all' ? 'month' : 'all'; fcat = ''; render(); };

function showHist(on) {
  logV.classList.toggle('hidden', on); histV.classList.toggle('hidden', !on);
  histBtn.textContent = on ? '‹ LOG' : 'HISTORY';
  if (on) loadHist();
}
function loadHist() {
  if (rows && !stale) { render(); return; }
  list.innerHTML = ''; list.appendChild(el('div', 'empty', 'loading…'));
  fetch(API + '?action=history&key=' + encodeURIComponent(KEY))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      rows = (d.rows || []).slice().sort(function (a, b) { return a[0] < b[0] ? 1 : a[0] > b[0] ? -1 : 0; });
      stale = false; render();
    })
    .catch(function () { list.innerHTML = ''; list.appendChild(el('div', 'empty', '⚠ could not load — check signal')); });
}
function render() {
  if (!rows) return;
  var all = mode === 'all';
  allB.classList.toggle('on', all);
  prevB.style.visibility = nextB.style.visibility = all ? 'hidden' : 'visible';
  var p = ym.split('-');
  per.textContent = all ? 'ALL TIME' : MON[+p[1] - 1] + ' ' + p[0];
  var s = q.value.trim().toLowerCase();
  var inP = rows.filter(function (r) { return (all || r[0].slice(0, 7) === ym) && (!s || (r[2] + ' ' + r[1]).toLowerCase().indexOf(s) >= 0); });
  var byCat = {}, sumP = 0;
  inP.forEach(function (r) { byCat[r[1]] = (byCat[r[1]] || 0) + r[3]; sumP += r[3]; });
  var cats = Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; });
  if (fcat && !byCat[fcat]) fcat = '';
  chips.innerHTML = '';
  [''].concat(cats).forEach(function (c) {
    var b = el('button', c === fcat ? 'on' : '', c || 'All');
    b.appendChild(el('i', '', fmt(c ? byCat[c] : sumP)));
    b.onclick = function () { fcat = c; render(); };
    chips.appendChild(b);
  });
  var shown = fcat ? inP.filter(function (r) { return r[1] === fcat; }) : inP;
  var sum = shown.reduce(function (s, r) { return s + r[3]; }, 0);
  tot.innerHTML = '';
  tot.appendChild(el('b', '', fmt(Math.round(sum))));
  tot.appendChild(el('small', '', (fcat || 'all categories') + (s ? ' · "' + s + '"' : '') + ' · ' + shown.length + (shown.length === 1 ? ' entry' : ' entries')));
  list.innerHTML = '';
  if (!shown.length) { list.appendChild(el('div', 'empty', s ? 'no matches' + (all ? '' : ' this month — try ALL') : 'nothing here yet')); return; }
  shown.forEach(function (r) {
    var row = el('div', 'row'), dp = r[0].split('-');
    var d = el('div', 'd'); d.appendChild(el('div', '', dp[2] + ' ' + MON[+dp[1] - 1])); if (all) d.appendChild(el('div', '', dp[0]));
    var w = el('div', 'w'); w.appendChild(el('div', '', r[2] || '—')); w.appendChild(el('small', '', r[1] + (r[4] === 'Recurring' ? ' · recurring' : '')));
    row.appendChild(d); row.appendChild(w); row.appendChild(el('div', 'a', fmt(r[3])));
    list.appendChild(row);
  });
}
</script>
</body>
</html>
